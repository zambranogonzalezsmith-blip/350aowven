<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Táctico Avanzado - Teatro de Operaciones VZLA</title>
    <style>
        body {
            margin: 0;
            background-color: #05070a;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 380px;
            background-color: #0f172a;
            border-right: 2px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
        }
        #map-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #020617;
            position: relative;
        }
        canvas {
            border: 2px solid #1e293b;
            background-color: #0b1120;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.05);
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #020617;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
        }
        button {
            background-color: #166534;
            color: #4ade80;
            border: 1px solid #4ade80;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #4ade80;
            color: #020617;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }
        .log {
            flex-grow: 1;
            border: 1px solid #334155;
            background-color: #020617;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        .log-usa { color: #60a5fa; } /* Azul */
        .log-fanb { color: #f87171; } /* Rojo */
        .log-leones { color: #fbbf24; font-weight: bold; } /* Dorado/Oro para Irregulares */
        .log-sys { color: #a3e635; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>COMANDO ESTRATÉGICO</h3>
        <textarea id="scenarioInput" placeholder="Ej: Ataque de EEUU en Maracaibo. El gobierno defiende Caracas. Irregulares Leones avanzan en Apure..."></textarea>
        <button onclick="procesarEntorno()">Ejecutar Simulación</button>
        
        <h4>REGISTRO DE COMBATE</h4>
        <div id="logConsole" class="log">> Sistema C4ISR inicializado...<br>> Satélites en posición. Monitoreando 3 facciones.</div>
    </div>

    <div id="map-container">
        <canvas id="venezuelaMap" width="800" height="650"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('venezuelaMap');
        const ctx = canvas.getContext('2d');

        // Base de datos de sectores estratégicos
        let sectores = {
            "caracas": { x: 450, y: 150, label: "CCS", tipo: "Centro Político", moral: 80, hp: 100, bando: "🇻🇪" },
            "maracaibo": { x: 180, y: 130, label: "MAR", tipo: "Reserva Petrolera", moral: 60, hp: 100, bando: "🇻🇪" },
            "san cristobal": { x: 130, y: 280, label: "SCR", tipo: "Corredor Fronterizo", moral: 45, hp: 100, bando: "🇻🇪" },
            "apure": { x: 320, y: 320, label: "APU", tipo: "Llanos/Guerrilla", moral: 50, hp: 100, bando: "🇻🇪" },
            "ciudad bolivar": { x: 580, y: 290, label: "CBL", tipo: "Cruce Río Orinoco", moral: 75, hp: 100, bando: "🇻🇪" },
            "paraguana": { x: 280, y: 70, label: "PAR", tipo: "Complejo Refinador", moral: 65, hp: 100, bando: "🇻🇪" },
            "guri": { x: 620, y: 360, label: "GURI", tipo: "Infraestructura (Energía)", moral: 85, hp: 100, bando: "🇻🇪" }
        };

        function dibujarBarras(x, y, moral, hp) {
            // Barra de HP (Daño Físico)
            ctx.fillStyle = '#334155'; ctx.fillRect(x - 20, y + 15, 40, 4);
            ctx.fillStyle = hp > 50 ? '#4ade80' : '#f87171';
            ctx.fillRect(x - 20, y + 15, (hp / 100) * 40, 4);
            
            // Barra de Moral (Apoyo Civil)
            ctx.fillStyle = '#334155'; ctx.fillRect(x - 20, y + 21, 40, 4);
            ctx.fillStyle = moral > 50 ? '#60a5fa' : '#fb923c';
            ctx.fillRect(x - 20, y + 21, (moral / 100) * 40, 4);
        }

        function redibujarBase() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.5)'; ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            for (let key in sectores) {
                const sec = sectores[key];
                
                ctx.beginPath(); ctx.arc(sec.x, sec.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#475569'; ctx.fill();
                
                ctx.fillStyle = 'rgba(148, 163, 184, 0.9)'; ctx.font = '12px Courier New';
                ctx.fillText(sec.bando + " " + sec.label, sec.x - 20, sec.y - 15);
                ctx.font = '9px Arial';
                ctx.fillText(sec.tipo, sec.x - 30, sec.y - 25);
                
                dibujarBarras(sec.x, sec.y, sec.moral, sec.hp);
            }
        }

        function dibujarUnidad(x, y, bandoStr, iconoTech) {
            ctx.beginPath(); ctx.arc(x + 20, y - 10, 14, 0, 2 * Math.PI);
            
            // Asignación de colores tácticos por facción
            if (bandoStr === 'usa') ctx.fillStyle = 'rgba(37, 99, 235, 0.8)'; // Azul
            else if (bandoStr === 'fanb') ctx.fillStyle = 'rgba(220, 38, 38, 0.8)'; // Rojo
            else if (bandoStr === 'leones') ctx.fillStyle = 'rgba(217, 119, 6, 0.9)'; // Dorado Intenso
            else ctx.fillStyle = 'rgba(100, 100, 100, 0.8)';
            
            ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
            
            ctx.fillStyle = '#fff'; ctx.font = '14px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(iconoTech, x + 20, y - 10);
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; 
        }

        function procesarEntorno() {
            const input = document.getElementById('scenarioInput').value.toLowerCase();
            const log = document.getElementById('logConsole');
            redibujarBase();

            log.innerHTML += "<br><span class='log-sys'>> Escaneando movimientos de vectores...</span>";

            let interaccion = false;

            for (let ciudad in sectores) {
                if (input.includes(ciudad)) {
                    interaccion = true;
                    let sec = sectores[ciudad];
                    
                    // Identificación de Facción
                    let esUSA = input.includes('eeuu') || input.includes('imperio') || input.includes('usa');
                    let esFANB = input.includes('fanb') || input.includes('ejercito') || input.includes('gobierno') || input.includes('venezuela');
                    let esLeones = input.includes('irregular') || input.includes('leones') || input.includes('insurgencia');
                    
                    // Identificación de Tecnología y Acciones
                    let techDron = input.includes('dron') || input.includes('drones');
                    let techRobot = input.includes('robot') || input.includes('mecha');
                    let ataque = input.includes('ataque') || input.includes('bombardeo') || input.includes('sabotaje') || input.includes('emboscada');

                    let bandoActivo = esUSA ? 'usa' : (esFANB ? 'fanb' : (esLeones ? 'leones' : 'indefinido'));
                    
                    // Asignación de icono: Si son leones, forzamos el león a menos que usen drones.
                    let icono = techDron ? '🚁' : (techRobot ? '🤖' : (bandoActivo === 'leones' ? '🦁' : '🪖'));
                    
                    let eta = Math.floor(Math.random() * 15) + 5; 

                    // 1. Lógica y Reacciones de EEUU
                    if (bandoActivo === 'usa') {
                        dibujarUnidad(sec.x, sec.y, 'usa', icono);
                        log.innerHTML += `<br><span class='log-usa'>> [🇺🇸 IMPERIO] Fuerzas operativas en ${sec.label}. ETA: ${eta} min.</span>`;
                        
                        if (ataque) {
                            sec.hp -= 25; 
                            sec.moral -= 10; 
                            log.innerHTML += `<br><span class='log-sys'>> [DAÑO] Bombardeo convencional. HP al ${sec.hp}%. Moral cae a ${sec.moral}%.</span>`;
                            log.innerHTML += `<br><span class='log-fanb'>> [🇻🇪 DEFENSA] Baterías antiaéreas activas. Fuerzas regulares aseguran el perímetro.</span>`;
                        }

                    // 2. Lógica y Reacciones de FANB/Gobierno
                    } else if (bandoActivo === 'fanb') {
                        dibujarUnidad(sec.x, sec.y, 'fanb', icono);
                        log.innerHTML += `<br><span class='log-fanb'>> [🇻🇪 GOBIERNO] Despliegue de tropas regulares en ${sec.label}. ETA: ${eta} min.</span>`;
                        sec.moral += 5; // El control estatal sube ligeramente la estabilidad
                        if (ataque) {
                            log.innerHTML += `<br><span class='log-fanb'>> [🇻🇪 OFENSIVA] Operación de barrido y contrainsurgencia iniciada en el sector.</span>`;
                        }

                    // 3. Lógica y Reacciones de Irregulares (Leones)
                    } else if (bandoActivo === 'leones') {
                        dibujarUnidad(sec.x, sec.y, 'leones', icono);
                        log.innerHTML += `<br><span class='log-leones'>> [🦁 LEONES] Célula irregular detectada operando en las sombras de ${sec.label}. ETA: Desconocido (Sigilo).</span>`;
                        
                        if (ataque) {
                            sec.hp -= 10; // Menos daño físico que un bombardeo
                            sec.moral -= 30; // Impacto masivo en la moral y control
                            log.innerHTML += `<br><span class='log-leones'>> [🦁 SABOTAJE] Tácticas asimétricas aplicadas. Infraestructura comprometida al ${sec.hp}%. Pánico civil, moral cae a ${sec.moral}%.</span>`;
                            log.innerHTML += `<br><span class='log-sys'>> [ALERTA] Fuerzas de seguridad del Estado (🇻🇪) desorientadas por la falta de un frente fijo.</span>`;
                        }
                    }
                    
                    // Cambio de Control Territorial (Captura)
                    if (sec.hp <= 0 || sec.moral <= 0) {
                        sec.hp = sec.hp <= 0 ? 0 : sec.hp;
                        sec.moral = sec.moral <= 0 ? 0 : sec.moral;
                        
                        if (bandoActivo === 'usa') sec.bando = "🇺🇸";
                        else if (bandoActivo === 'leones') sec.bando = "🦁";
                        else if (bandoActivo === 'fanb') sec.bando = "🇻🇪";

                        log.innerHTML += `<br><span class='log-sys'>> [⚠️ COLAPSO] El sector ${sec.label} ha caído bajo el control de la facción atacante.</span>`;
                    }
                }
            }

            if (!interaccion) log.innerHTML += "<br><span class='log-sys'>> Sin órdenes procesables. Identifique Facción (Ej: Leones, EEUU, FANB), Acción (Ej: Ataque, Despliegue) y Sector.</span>";
            
            redibujarBase();
            log.scrollTop = log.scrollHeight;
        }

        redibujarBase();
    </script>
</body>
</html>
