<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Command: VZLA Engine</title>
    <style>
        body { margin: 0; background: #020617; color: #4ade80; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #map-canvas { display: block; cursor: crosshair; }
        #ui-overlay { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .info { background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #4ade80; }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div class="info">COMANDO: Arrastra unidades (🚁, 🤖, 🦁, 🪖) a los puntos de control.</div>
</div>
<canvas id="map-canvas"></canvas>

<script>
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let units = [
        { x: 100, y: 100, type: '🚁', faction: 'usa' },
        { x: 100, y: 200, type: '🦁', faction: 'leones' },
        { x: 100, y: 300, type: '🪖', faction: 'fanb' }
    ];

    let dragUnit = null;

    canvas.addEventListener('pointerdown', (e) => {
        units.forEach(u => {
            if (Math.hypot(u.x - e.clientX, u.y - e.clientY) < 30) dragUnit = u;
        });
    });

    canvas.addEventListener('pointermove', (e) => {
        if (dragUnit) {
            dragUnit.x = e.clientX;
            dragUnit.y = e.clientY;
            render();
        }
    });

    canvas.addEventListener('pointerup', () => dragUnit = null);

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Dibujar mapa base simple
        ctx.strokeStyle = '#1e293b';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        
        // Dibujar unidades
        units.forEach(u => {
            ctx.fillStyle = u.faction === 'usa' ? '#3b82f6' : (u.faction === 'fanb' ? '#ef4444' : '#f59e0b');
            ctx.beginPath();
            ctx.arc(u.x, u.y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(u.type, u.x, u.y + 7);
        });
    }

    render();
</script>
</body>
</html>
