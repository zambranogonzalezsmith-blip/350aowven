<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Táctico</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #canvas { display: block; background: #080b11; cursor: crosshair; }
        .ui { position: absolute; top: 10px; left: 10px; z-index: 100; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="ui">
    <button onclick="addUnit('🚁')">Dron</button>
    <button onclick="addUnit('🦁')">León</button>
</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let units = [{x: 100, y: 100, type: '🚁'}];
    let selected = null;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    function addUnit(type) { units.push({x: 50, y: 50, type: type}); }

    canvas.addEventListener('mousedown', e => {
        selected = units.find(u => Math.hypot(u.x - e.clientX, u.y - e.clientY) < 40);
    });

    window.addEventListener('mousemove', e => {
        if (selected) {
            selected.x = e.clientX;
            selected.y = e.clientY;
        }
    });

    window.addEventListener('mouseup', () => selected = null);

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Dibujar zonas
        ctx.strokeStyle = '#333';
        ctx.strokeRect(canvas.width/2 - 50, canvas.height/2 - 50, 100, 100);
        
        // Dibujar unidades
        units.forEach(u => {
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.fillText(u.type, u.x, u.y);
        });
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
